<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan JavaScript</title>
</head>
<body>

    <h2>Mengecek Bilangan Ganjil atau Genap</h2>
    Masukkan angka:
    <input type="number" id="angka">
    <button onclick="cekBilangan()">Periksa</button>
    <p id="hasilAngka"></p>

    <h2>Konversi Celsius ke Fahrenheit</h2>
    Suhu Celsius:
    <input type="number" id="celsius">
    <button onclick="konversiSuhu()">Konversi</button>
    <p id="hasilSuhu"></p>

    <script>
        function cekBilangan() {
            let angka = document.getElementById("angka").value;

            if (angka === "") {
                document.getElementById("hasilAngka").innerHTML =
                    "Masukkan angka terlebih dahulu.";
                return;
            }

            if (Number(angka) % 2 === 0) {
                document.getElementById("hasilAngka").innerHTML =
                    angka + " adalah bilangan genap.";
            } else {
                document.getElementById("hasilAngka").innerHTML =
                    angka + " adalah bilangan ganjil.";
            }
        }

        function konversiSuhu() {
            let celsius = document.getElementById("celsius").value;

            if (celsius === "") {
                document.getElementById("hasilSuhu").innerHTML =
                    "Masukkan suhu terlebih dahulu.";
                return;
            }

            let fahrenheit = (Number(celsius) * 9 / 5) + 32;

            document.getElementById("hasilSuhu").innerHTML =
                celsius + "°C = " + fahrenheit.toFixed(2) + "°F";
        }
    </script>

</body>
</html>
